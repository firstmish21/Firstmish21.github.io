<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת אבטחה פאזבייר</title>
    <style>
        body {
            background-color: black;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #terminal {
            width: 85%;
            max-width: 900px;
            border: 3px double #00ff41;
            padding: 30px;
            background-color: rgba(0, 10, 0, 0.95);
            box-shadow: 0 0 20px #00ff41;
        }

        h2 {
            text-align: center;
            letter-spacing: 8px;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
        }

        #aiAnswer {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #004400;
            padding: 15px;
            margin: 20px 0;
            background: #050505;
            line-height: 1.6;
            white-space: pre-wrap; /* תומך בשורות חדשות */
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            background: black;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px;
            font-family: inherit;
            outline: none;
            font-size: 1em;
        }

        button {
            background: #002200;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: background 0.15s, color 0.15s;
        }

        button:hover {
            background: #00ff41;
            color: black;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #camera {
            width: 100%;
            max-width: 640px;
            height: 220px;
            object-fit: cover;
            border: 2px solid #00ff41;
            display: block;
            margin: 0 auto 10px auto;
            filter: grayscale(30%);
        }

        #camLabel {
            text-align: center;
            font-size: 0.8em;
            letter-spacing: 4px;
            color: #00aa33;
            margin-bottom: 5px;
        }

        #statusBar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            margin-bottom: 15px;
        }

        /* אינדיקטור מיקרופון פעיל */
        #micBtn.listening {
            background: #440000;
            border-color: #ff0000;
            color: #ff4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div id="terminal">

    <div id="statusBar">
        <span>LOCAL_IP: 192.168.0.150</span>
        <span id="sysStatus">SYSTEM: ONLINE</span>
        <span id="clock"></span>
    </div>

    <h2>FAZBEAR SECURITY AI</h2>

    <div id="camLabel">[ CAM-01 / MAIN ENTRANCE ]</div>
    <video id="camera" autoplay muted playsinline></video>

    <div style="text-align:center; margin-bottom:15px;">
        <button id="camBtn">הפעל מצלמה</button>
    </div>

    <div id="aiAnswer">מערכת מוכנה... [Awaiting Input]</div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="הכנס פקודה...">
        <button id="sendBtn">שלח</button>
        <button id="micBtn">🎤 מיקרופון</button>
    </div>

    <div id="voiceText" style="font-size:0.8em; color:#00661a; margin-top:8px; min-height:1.2em;"></div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ← הכנס כאן את המפתח שלך
    const API_KEY = "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";

    const firebaseConfig = {
        apiKey: "AIzaSyDg7b8jru0rOx2EGfeSoewcu1wHAFynSHs",
        authDomain: "project-shalty.firebaseapp.com",
        databaseURL: "https://project-shalty-default-rtdb.firebaseio.com",
        projectId: "project-shalty",
        storageBucket: "project-shalty.firebasestorage.app",
        messagingSenderId: "984471122116",
        appId: "1:984471122116:web:8f958b467378fd19475991"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const answerBox   = document.getElementById('aiAnswer');
    const userInput   = document.getElementById('userInput');
    const sendBtn     = document.getElementById('sendBtn');
    const micBtn      = document.getElementById('micBtn');
    const voiceText   = document.getElementById('voiceText');
    const sysStatus   = document.getElementById('sysStatus');

    // ─── שליחה ל-AI ───────────────────────────────────────────────
    async function askAI(text) {
        if (!text.trim()) return;

        // חוסמים את הכפתורים בזמן טעינה
        sendBtn.disabled = true;
        micBtn.disabled  = true;
        answerBox.textContent = "מנתח... [SCANNING]";
        sysStatus.textContent = "SYSTEM: PROCESSING";

        try {
            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': API_KEY,
                    'anthropic-version': '2023-06-01',
                    'anthropic-dangerous-direct-browser-access': 'true'
                },
                body: JSON.stringify({
                    model: "claude-haiku-4-5-20251001",
                    max_tokens: 1000,
                    system: `אתה ה-AI של חדר האבטחה בפיצרייה של פאזבייר. 
                             ענה בעברית בטון קריפי ומסתורי. 
                             תשלב מדי פעם [ERROR], [STATIC] או [MOVEMENT DETECTED].
                             אל תגיד שאתה AI.`,
                    messages: [{ role: "user", content: text }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                // שגיאה מה-API (מפתח שגוי, מכסה, וכו')
                answerBox.textContent = `[ERROR ${response.status}]: ${data?.error?.message || "שגיאה לא ידועה"}`;
                return;
            }

            if (!data.content || !data.content[0]) {
                answerBox.textContent = "[ERROR]: תגובה ריקה מהשרת";
                return;
            }

            const reply = data.content[0].text;
            answerBox.textContent = reply;
            speakText(reply);

            // שמירה ב-Firebase
            await push(ref(db, 'security_logs'), {
                timestamp: Date.now(),
                prompt: text,
                response: reply
            });

        } catch (err) {
            // שגיאת רשת / CORS / וכו'
            answerBox.textContent = `[NETWORK ERROR]: ${err.message}`;
            console.error("askAI error:", err);
        } finally {
            // משחרר כפתורים תמיד, גם אם הייתה שגיאה
            sendBtn.disabled = false;
            micBtn.disabled  = false;
            sysStatus.textContent = "SYSTEM: ONLINE";
        }
    }

    // ─── כפתור שליחה ──────────────────────────────────────────────
    sendBtn.addEventListener('click', () => {
        const text = userInput.value.trim();
        if (text) {
            askAI(text);
            userInput.value = "";
        }
    });

    // ─── Enter מהמקלדת ────────────────────────────────────────────
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const text = userInput.value.trim();
            if (text) {
                askAI(text);
                userInput.value = "";
            }
        }
    });

    // ─── מיקרופון ─────────────────────────────────────────────────
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRec) {
        // הדפדפן לא תומך בזיהוי קול
        micBtn.textContent = "🎤 לא נתמך";
        micBtn.disabled = true;
    } else {
        const recognition = new SpeechRec();
        recognition.lang = 'he-IL';
        recognition.continuous = false;
        recognition.interimResults = false;

        let isListening = false;

        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
                return;
            }
            voiceText.textContent = "מאזין...";
            recognition.start();
        });

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            micBtn.textContent = "⏹ עצור";
        };

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            voiceText.textContent = "קלט קולי: " + text;
            userInput.value = text; // שם בשדה כדי שהמשתמש יראה מה נאמר
            askAI(text);
        };

        recognition.onerror = (event) => {
            // שגיאות נפוצות: no-speech, not-allowed, network
            voiceText.textContent = `[MIC ERROR]: ${event.error}`;
            console.error("Speech recognition error:", event.error);
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.textContent = "🎤 מיקרופון";
            if (voiceText.textContent === "מאזין...") {
                voiceText.textContent = "[לא זוהה קול]";
            }
        };
    }

    // ─── מצלמה ────────────────────────────────────────────────────
    let camStream = null;
    document.getElementById('camBtn').addEventListener('click', async () => {
        const cam    = document.getElementById('camera');
        const camBtn = document.getElementById('camBtn');

        if (!camStream) {
            try {
                camStream = await navigator.mediaDevices.getUserMedia({ video: true });
                cam.srcObject = camStream;
                camBtn.textContent = 'כבה מצלמה';
            } catch (err) {
                alert("לא ניתן לגשת למצלמה: " + err.message);
            }
        } else {
            camStream.getTracks().forEach(t => t.stop());
            cam.srcObject = null;
            camStream = null;
            camBtn.textContent = 'הפעל מצלמה';
        }
    });

    // ─── סינתזת קול ───────────────────────────────────────────────
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel(); // מבטל דיבור קודם אם יש
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang  = 'he-IL';
        speech.pitch = 0.7;
        speech.rate  = 0.9;
        window.speechSynthesis.speak(speech);
    }

    // ─── שעון ─────────────────────────────────────────────────────
    const clockEl = document.getElementById('clock');
    const updateClock = () => {
        clockEl.textContent = new Date().toLocaleTimeString('he-IL');
    };
    updateClock();
    setInterval(updateClock, 1000);

</script>

</body>
</html>
