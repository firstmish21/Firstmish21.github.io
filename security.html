<body>

<script type="module">

    // Строка 202: Ссылка на поле ввода ключа в DOM
    const apiKeyInput = document.getElementById('apiKeyInput');

    // Строка 203: Ссылка на span статуса ключа
    const apiStatus   = document.getElementById('apiStatus');

    // Строка 204: Функция — читает API-ключ из localStorage
    function getApiKey() {
        return localStorage.getItem(LS_KEY) || ""; // Строка 205: || "" — если нет ключа, вернуть пустую строку
    }

    // Строка 206: Функция — обновляет зелёный/красный индикатор статуса ключа
    function updateApiStatus() {
        const key = getApiKey(); // Строка 207: Читаем ключ из localStorage
        if (key && key.startsWith("gsk_")) { // Строка 208: Ключ есть И начинается с "gsk_" (формат Groq)
            apiStatus.textContent   = "[ ✓ מפתח שמור ]"; // Строка 209: Текст "ключ сохранён"
            apiStatus.className     = "ok";               // Строка 210: Класс "ok" → CSS делает текст зелёным
            apiKeyInput.placeholder = "gsk_••••••••••••"; // Строка 211: Показываем что ключ уже есть
        } else { // Строка 212: Ключа нет или неверный формат
            apiStatus.textContent = "[ לא מוגדר ]"; // Строка 213: "Не определён"
            apiStatus.className   = "err";           // Строка 214: Класс "err" → CSS делает текст красным
        }
    }

    updateApiStatus(); // Строка 215: Проверяем статус сразу при загрузке страницы

    // Строка 216: Обработчик кнопки "Сохранить"
    document.getElementById('apiSaveBtn').addEventListener('click', () => {
        const val = apiKeyInput.value.trim(); // Строка 217: Читаем поле, .trim() убирает пробелы
        if (!val.startsWith("gsk_")) { // Строка 218: Не начинается с "gsk_" — не Groq ключ
            apiStatus.textContent = "[ ✗ מפתח לא תקין — חייב להתחיל ב-gsk_ ]"; // Строка 219: Ошибка
            apiStatus.className   = "err"; // Строка 220: Красный
            return; // Строка 221: Выходим — не сохраняем неверный ключ
        }
        localStorage.setItem(LS_KEY, val); // Строка 222: Сохраняем в localStorage (хранится между сессиями)
        apiKeyInput.value = "";            // Строка 223: Очищаем поле
        updateApiStatus();                 // Строка 224: Показываем зелёный "✓"
    });

    // Строка 225: Обработчик кнопки "Удалить"
    document.getElementById('apiClearBtn').addEventListener('click', () => {
        localStorage.removeItem(LS_KEY); // Строка 226: Удаляем ключ из localStorage
        apiKeyInput.value = "";          // Строка 227: Очищаем поле
        updateApiStatus();               // Строка 228: Показываем красный "не определён"
    });

    // Строка 229: Конфигурация Firebase — параметры из Firebase Console
    const firebaseConfig = {
        apiKey:            "AIzaSyDg7b8jru0rOx2EGfeSoewcu1wHAFynSHs", // Строка 230: API-ключ Firebase (не Groq!)
        authDomain:        "project-shalty.firebaseapp.com",            // Строка 231: Домен аутентификации
        databaseURL:       "https://project-shalty-default-rtdb.firebaseio.com", // Строка 232: URL Realtime DB
        projectId:         "project-shalty",                            // Строка 233: ID проекта
        storageBucket:     "project-shalty.firebasestorage.app",       // Строка 234: Хранилище файлов
        messagingSenderId: "984471122116",                              // Строка 235: ID для Push-уведомлений
        appId:             "1:984471122116:web:8f958b467378fd19475991" // Строка 236: ID приложения
    };

    const app = initializeApp(firebaseConfig); // Строка 237: Инициализируем Firebase с нашим конфигом
    const db  = getDatabase(app);              // Строка 238: Получаем объект Realtime Database

    const answerBox = document.getElementById('aiAnswer');  // Строка 239: Блок вывода ответов AI
    const userInput = document.getElementById('userInput'); // Строка 240: Поле ввода команды
    const sendBtn   = document.getElementById('sendBtn');   // Строка 241: Кнопка "Отправить"
    const micBtn    = document.getElementById('micBtn');    // Строка 242: Кнопка микрофона
    const voiceText = document.getElementById('voiceText'); // Строка 243: Строка голосового ввода
    const sysStatus = document.getElementById('sysStatus'); // Строка 244: "SYSTEM: ONLINE"

    let espListening   = false; // Строка 245: Флаг — слушаем ли Firebase (false = выключено)
    let espUnsubscribe = null;  // Строка 246: Функция отписки от onValue (null = не подписаны)

    // Строка 247: Обработчик кнопки ESP-CAM
    document.getElementById('espBtn').addEventListener('click', () => {
        const espBtn      = document.getElementById('espBtn');      // Строка 248: Сама кнопка (для смены текста)
        const img         = document.getElementById('espCamImg');   // Строка 249: img для кадра
        const placeholder = document.getElementById('espPlaceholder'); // Строка 250: Заглушка
        const dot         = document.getElementById('espDot');      // Строка 251: Светодиод

        if (!espListening) { // Строка 252: Не слушаем — нужно ВКЛЮЧИТЬ
            espListening            = true;                          // Строка 253: Ставим флаг
            espBtn.textContent      = "כבה ESP-CAM";                // Строка 254: Меняем текст кнопки
            placeholder.textContent = "[ מחכה לפריים ראשון... ]";  // Строка 255: Сообщение ожидания

            const cameraRef = ref(db, 'camera'); // Строка 256: Ссылка על узел /camera в Realtime DB

            // Строка 257: onValue — подписываемся. Вызывается при КАЖДОМ изменении узла /camera
            // Возвращает функцию отписки — сохраняем в espUnsubscribe
            espUnsubscribe = onValue(cameraRef, (snapshot) => {
                const data = snapshot.val();          // Строка 258: .val() — читаем данные (объект или null)
                if (!data || !data.frame) return;     // Строка 259: Нет кадра — ждём следующий

                img.src                   = "data:image/jpeg;base64," + data.frame; // Строка 260: Подставляем base64-JPEG
                img.style.display         = "block"; // Строка 261: Показываем img
                placeholder.style.display = "none";  // Строка 262: Скрываем заглушку
                dot.classList.replace('off', 'on');  // Строка 263: Светодиод: "off"→"on" → зелёный
            }, (error) => { // Строка 264: Второй аргумент onValue — обработчик ошибок
                console.error("Firebase ESP-CAM error:", error); // Строка 265: В консоль F12
                placeholder.textContent = "[ שגיאת Firebase ]";  // Строка 266: Показываем ошибку
            });

        } else { // Строка 267: Слушаем — нужно ВЫКЛЮЧИТЬ
            if (espUnsubscribe) { espUnsubscribe(); espUnsubscribe = null; } // Строка 268: Отписываемся от Firebase
            espListening              = false;            // Строка 269: Сбрасываем флаг
            img.src                   = "";              // Строка 270: Очищаем src
            img.style.display         = "none";          // Строка 271: Скрываем img
            placeholder.style.display = "flex";          // Строка 272: Показываем заглушку (flex для центрирования)
            placeholder.textContent   = "[ NO SIGNAL ]"; // Строка 273: Текст заглушки
            dot.classList.replace('on', 'off');           // Строка 274: Светодиод: "on"→"off" → тёмно-красный
            espBtn.textContent        = "הפעל ESP-CAM";  // Строка 275: Возвращаем исходный текст кнопки
        }
    });

    // Строка 276: async функция — внутри можно await для ожидания ответа сервера
    async function askAI(text) {
        if (!text.trim()) return; // Строка 277: Пустой текст — выходим

        const key = getApiKey(); // Строка 278: Читаем ключ из localStorage
        if (!key) { // Строка 279: Ключа нет
            answerBox.textContent = "[ERROR]: הכנס Groq API Key בשדה למעלה ולחץ שמור"; // Строка 280: Инструкция
            return; // Строка 281: Выходим
        }

        sendBtn.disabled      = true;              // Строка 282: Блокируем "Отправить" (нельзя нажать дважды)
        micBtn.disabled       = true;              // Строка 283: Блокируем микрофон
        answerBox.textContent = "מנתח... [SCANNING]"; // Строка 284: Индикатор загрузки
        sysStatus.textContent = "SYSTEM: PROCESSING"; // Строка 285: Меняем статус

        try { // Строка 286: try — если ошибка внутри, переходим в catch
            // Строка 287: fetch — HTTP POST к Groq API. await — ждём ответа
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST', // Строка 288: POST — отправляем данные на сервер
                headers: {
                    'Content-Type':  'application/json',      // Строка 290: Тело запроса — JSON
                    'Authorization': `Bearer ${key}`          // Строка 291: Bearer токен — аутентификация API
                },
                body: JSON.stringify({ // Строка 292: JSON.stringify — объект JS в строку JSON
                    model:      "llama-3.1-8b-instant", // Строка 293: Быстрая бесплатная модель LLaMA 3.1 8B
                    max_tokens: 1000,                   // Строка 294: Максимум 1000 токенов (~750 слов)
                    messages: [ // Строка 295: Массив сообщений — история разговора
                        {
                            role: "system", // Строка 296: "system" — инструкция AI (не видна пользователю)
                            content: `אתה ה-AI של חדר האבטחה בפיצרייה של פאזבייר.
                                      ענה בעברית בטון קריפי ומסתורי.
                                      תשלב מדי פעם [ERROR], [STATIC] או [MOVEMENT DETECTED].
                                      אל תגיד שאתה AI.`
                            // Строка 297-300: Системный промпт — личность AI-охранника пиццерии FNAF
                        },
                        { role: "user", content: text } // Строка 301: "user" — сообщение пользователя
                    ]
                })
            });

            const data = await response.json(); // Строка 302: .json() парсит JSON-ответ в объект JS

            if (!response.ok) { // Строка 303: response.ok=false если статус 4xx/5xx (ошибка сервера)
                if (response.status === 401) { // Строка 304: 401 Unauthorized — ключ недействителен
                    apiStatus.textContent = "[ ✗ מפתח לא תקין — צור חדש ב-console.groq.com ]"; // Строка 305
                    apiStatus.className   = "err";            // Строка 306: Красный
                    localStorage.removeItem(LS_KEY);          // Строка 307: Удаляем невалидный ключ
                }
                answerBox.textContent = `[ERROR ${response.status}]: ${data?.error?.message || "שגיאה"}`;
                // Строка 308: ?. — опциональная цепочка (не падает если error=undefined)
                return; // Строка 309: Выходим
            }

            const reply = data.choices[0].message.content;
            // Строка 310: choices[0]=первый вариант, .message.content=текст ответа
            answerBox.textContent = reply; // Строка 311: Показываем ответ
            speakText(reply);              // Строка 312: Браузер зачитает ответ вслух

            // Строка 313: push — добавляет запись в /security_logs с авто-ID
            await push(ref(db, 'security_logs'), {
                timestamp: Date.now(), // Строка 314: Unix-время в мс — для сортировки
                prompt:    text,       // Строка 315: Вопрос пользователя
                response:  reply       // Строка 316: Ответ AI
            });

        } catch (err) { // Строка 317: Сетевая ошибка (нет интернета, CORS и т.д.)
            answerBox.textContent = `[NETWORK ERROR]: ${err.message}`; // Строка 318: err.message — стандартное свойство Error
        } finally { // Строка 319: finally — выполняется ВСЕГДА (и при успехе, и при ошибке)
            sendBtn.disabled      = false;          // Строка 320: Разблокируем "Отправить"
            micBtn.disabled       = false;          // Строка 321: Разблокируем микрофон
            sysStatus.textContent = "SYSTEM: ONLINE"; // Строка 322: Возвращаем статус
        }
    }

    // Строка 323: Клик по кнопке "Отправить"
    sendBtn.addEventListener('click', () => {
        const text = userInput.value.trim(); // Строка 324: Читаем поле, убираем пробелы
        if (text) { askAI(text); userInput.value = ""; } // Строка 325: Отправляем и очищаем поле
    });

    // Строка 326: Нажатие клавиши в поле ввода
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { // Строка 327: Только если Enter
            const text = userInput.value.trim(); // Строка 328: Читаем текст
            if (text) { askAI(text); userInput.value = ""; } // Строка 329: То же что кнопка "Отправить"
        }
    });

    let camStream = null; // Строка 330: MediaStream камеры (null = выключена)

    // Строка 331: Кнопка веб-камеры. async нужен для await
    document.getElementById('camBtn').addEventListener('click', async () => {
        const cam    = document.getElementById('camera'); // Строка 332: video-элемент
        const camBtn = document.getElementById('camBtn'); // Строка 333: Сама кнопка

        if (!camStream) { // Строка 334: Потока нет — ВКЛЮЧАЕМ
            try { // Строка 335: try — пользователь может запретить доступ
                camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                // Строка 336: Запрашиваем видеопоток. Браузер показывает диалог разрешения.
                // video:true=нужно видео, audio:false=звук не нужен
                cam.srcObject = camStream; // Строка 337: Привязываем поток к video-элементу
                await cam.play();          // Строка 338: Запускаем воспроизведение явно
                camBtn.textContent = 'כבה מצלמה'; // Строка 339: "Выключить камеру"
            } catch (err) { // Строка 340: Пользователь запретил или камера занята
                alert("שגיאת מצלמה: " + err.message); // Строка 341: Всплывающее окно с ошибкой
            }
        } else { // Строка 342: Поток есть — ВЫКЛЮЧАЕМ
            camStream.getTracks().forEach(t => t.stop());
            // Строка 343: getTracks()=все треки, stop() каждый. Без этого индикатор камеры не погаснет!
            cam.srcObject      = null;           // Строка 344: Отвязываем поток — экран гаснет
            camStream          = null;           // Строка 345: Сбрасываем переменную
            camBtn.textContent = 'הפעל מצלמה'; // Строка 346: Возвращаем "Включить камеру"
        }
    });

    // Строка 347: Chrome=SpeechRecognition, Safari=webkitSpeechRecognition. || берём что поддерживается
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRec) { // Строка 348: Браузер не поддерживает (Firefox Desktop)
        micBtn.textContent = "🎤 לא נתמך"; // Строка 349: "Не поддерживается"
        micBtn.disabled    = true;          // Строка 350: Кнопка неактивна
    } else { // Строка 351: Поддерживает — настраиваем
        const recognition          = new SpeechRec(); // Строка 352: Объект распознавания речи
        recognition.lang           = 'he-IL';         // Строка 353: Язык: иврит (Израиль)
        recognition.continuous     = false;           // Строка 354: false = одна фраза, не непрерывный режим
        recognition.interimResults = false;           // Строка 355: false = только финальные результаты
        let isListening = false; // Строка 356: Флаг — идёт ли запись

        // Строка 357: Клик по кнопке микрофона
        micBtn.addEventListener('click', () => {
            if (isListening) { recognition.stop(); return; } // Строка 358: Уже слушаем — стоп
            voiceText.textContent = "מאזין..."; // Строка 359: Индикатор "Слушаю..."
            recognition.start(); // Строка 360: Начинаем запись
        });

        // Строка 361: Микрофон начал работу
        recognition.onstart = () => {
            isListening = true; // Строка 362: Ставим флаг
            micBtn.classList.add('listening'); // Строка 363: CSS включает мигающую красную анимацию
            micBtn.textContent = "⏹ עצור";    // Строка 364: Кнопка становится "Стоп"
        };

        // Строка 365: Получен результат распознавания
        recognition.onresult = (e) => {
            const t = e.results[0][0].transcript;
            // Строка 366: results[0]=первый результат, [0]=наиболее вероятный, .transcript=текст
            voiceText.textContent = "קלט קולי: " + t; // Строка 367: Показываем распознанный текст
            userInput.value = t;                        // Строка 368: Вставляем в поле ввода
            askAI(t);                                   // Строка 369: Сразу отправляем AI
        };

        // Строка 370: Ошибка — timeout, no-speech, not-allowed и т.д.
        recognition.onerror = (e) => { voiceText.textContent = `[MIC ERROR]: ${e.error}`; };

        // Строка 371: Запись закончилась (неважно успешно или нет)
        recognition.onend = () => {
            isListening = false; // Строка 372: Сбрасываем флаг
            micBtn.classList.remove('listening'); // Строка 373: Останавливаем красное мигание
            micBtn.textContent = "🎤 מיקרופון";   // Строка 374: Возвращаем исходный текст
            if (voiceText.textContent === "מאזין...") voiceText.textContent = "[לא זוהה קול]";
            // Строка 375: Если так и осталось "Слушаю..." — голос не распознан
        };
    }

    // Строка 376: Синтез речи — браузер читает ответ AI вслух
    function speakText(text) {
        if (!window.speechSynthesis) return; // Строка 377: Браузер не поддерживает TTS — выходим
        window.speechSynthesis.cancel();      // Строка 378: Останавливаем предыдущее воспроизведение
        const speech  = new SpeechSynthesisUtterance(text); // Строка 379: Объект с текстом для озвучки
        speech.lang   = 'he-IL'; // Строка 380: Голос иврит
        speech.pitch  = 0.7;     // Строка 381: Высота: 1.0=норма, 0.7=ниже нормы (жутковато)
        speech.rate   = 0.9;     // Строка 382: Скорость: 1.0=норма, 0.9=чуть медленнее (зловеще)
        window.speechSynthesis.speak(speech); // Строка 383: Запускаем воспроизведение
    }

    const clockEl = document.getElementById('clock'); // Строка 384: Span с часами

    // Строка 385: Функция tick — форматирует текущее время на иврите (ЧЧ:ММ:СС)
    const tick = () => { clockEl.textContent = new Date().toLocaleTimeString('he-IL'); };
    tick(); // Строка 386: Первый вызов сразу — часы видны мгновенно, не через секунду
    setInterval(tick, 1000); // Строка 387: Повторяем каждые 1000мс = 1 секунда

</script>
<!-- Строка 388: Закрытие JS-блока -->
</body>
