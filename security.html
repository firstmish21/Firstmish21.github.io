<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת אבטחה פאזבייר</title>
    <style>
        body {
            background-color: black;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        #terminal {
            width: 90%;
            max-width: 1100px;
            border: 3px double #00ff41;
            padding: 30px;
            background-color: rgba(0, 10, 0, 0.95);
            box-shadow: 0 0 20px #00ff41;
        }
        h2 {
            text-align: center;
            letter-spacing: 8px;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
            margin-top: 0;
        }
        #cameras-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .cam-block {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .cam-label {
            text-align: center;
            font-size: 0.75em;
            letter-spacing: 3px;
            color: #00aa33;
            margin-bottom: 4px;
        }
        #camera {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid #00ff41;
            display: block;
            filter: grayscale(30%);
            background: #050505;
        }
        #espCamImg {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid #00ff41;
            display: block;
            filter: grayscale(30%);
            background: #050505;
        }
        #espPlaceholder {
            width: 100%;
            height: 200px;
            border: 2px solid #004400;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: #004400;
            font-size: 0.85em;
            letter-spacing: 2px;
        }
        #cam-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: flex-end;
        }
        .cam-btn-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #aiAnswer {
            height: 180px;
            overflow-y: auto;
            border: 1px solid #004400;
            padding: 15px;
            margin: 15px 0;
            background: #050505;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] {
            flex-grow: 1;
            background: black;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px;
            font-family: inherit;
            outline: none;
            font-size: 1em;
        }
        button {
            background: #002200;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        button:hover    { background: #00ff41; color: black; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #statusBar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            margin-bottom: 15px;
        }
        #micBtn.listening {
            background: #440000;
            border-color: #ff0000;
            color: #ff4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.5; }
        }
        .dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-left: 5px;
            vertical-align: middle;
        }
        .dot.on  { background: #00ff41; box-shadow: 0 0 6px #00ff41; }
        .dot.off { background: #440000; }
    </style>
</head>
<body>
<div id="terminal">

    <div id="statusBar">
        <span>LOCAL_IP: 192.168.0.150</span>
        <span id="sysStatus">SYSTEM: ONLINE</span>
        <span id="clock"></span>
    </div>

    <h2>FAZBEAR SECURITY AI</h2>

    <div id="cameras-row">

        <div class="cam-block">
            <div class="cam-label">[ CAM-01 / MAIN ENTRANCE ]</div>
            <video id="camera" autoplay muted playsinline></video>
        </div>

        <div class="cam-block">
            <div class="cam-label">
                [ CAM-02 / ESP-CAM — FIREBASE ]
                <span id="espDot" class="dot off"></span>
            </div>
            <div id="espPlaceholder">[ ממתין ל-FIREBASE... ]</div>
            <img id="espCamImg" src="" alt="ESP-CAM" style="display:none;">
        </div>

    </div>

    <div id="cam-controls">
        <div class="cam-btn-group">
            <button id="camBtn">הפעל מצלמה</button>
        </div>
        <div class="cam-btn-group">
            <button id="espBtn">הפעל ESP-CAM</button>
        </div>
    </div>

    <div id="aiAnswer">מערכת מוכנה... [Awaiting Input]</div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="הכנס פקודה...">
        <button id="sendBtn">שלח</button>
        <button id="micBtn">🎤 מיקרופון</button>
    </div>

    <div id="voiceText" style="font-size:0.8em; color:#00661a; margin-top:8px; min-height:1.2em;"></div>

</div>

<script type="module">
    import { initializeApp }              from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const API_KEY = "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";

    const firebaseConfig = {
        apiKey:            "AIzaSyDg7b8jru0rOx2EGfeSoewcu1wHAFynSHs",
        authDomain:        "project-shalty.firebaseapp.com",
        databaseURL:       "https://project-shalty-default-rtdb.firebaseio.com",
        projectId:         "project-shalty",
        storageBucket:     "project-shalty.firebasestorage.app",
        messagingSenderId: "984471122116",
        appId:             "1:984471122116:web:8f958b467378fd19475991"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const answerBox = document.getElementById('aiAnswer');
    const userInput = document.getElementById('userInput');
    const sendBtn   = document.getElementById('sendBtn');
    const micBtn    = document.getElementById('micBtn');
    const voiceText = document.getElementById('voiceText');
    const sysStatus = document.getElementById('sysStatus');

    // ─── ESP-CAM דרך Firebase ─────────────────────────────────────
    let espListening  = false;
    let espUnsubscribe = null;

    document.getElementById('espBtn').addEventListener('click', () => {
        const espBtn      = document.getElementById('espBtn');
        const img         = document.getElementById('espCamImg');
        const placeholder = document.getElementById('espPlaceholder');
        const dot         = document.getElementById('espDot');

        if (!espListening) {
            // מתחיל להאזין ל-Firebase
            espListening = true;
            espBtn.textContent = "כבה ESP-CAM";
            placeholder.textContent = "[ מחכה לפריים ראשון... ]";

            const cameraRef = ref(db, 'camera');
            espUnsubscribe = onValue(cameraRef, (snapshot) => {
                const data = snapshot.val();
                if (!data || !data.frame) return;

                // מציג את הפריים מ-Firebase
                img.src = "data:image/jpeg;base64," + data.frame;
                img.style.display = "block";
                placeholder.style.display = "none";
                dot.classList.replace('off', 'on');
            }, (error) => {
                console.error("Firebase ESP-CAM error:", error);
                placeholder.textContent = "[ שגיאת Firebase ]";
            });

        } else {
            // מפסיק האזנה
            if (espUnsubscribe) { espUnsubscribe(); espUnsubscribe = null; }
            espListening = false;
            img.src = "";
            img.style.display = "none";
            placeholder.style.display = "flex";
            placeholder.textContent = "[ NO SIGNAL ]";
            dot.classList.replace('on', 'off');
            espBtn.textContent = "הפעל ESP-CAM";
        }
    });

    // ─── שליחה ל-AI (Groq) ────────────────────────────────────────
    async function askAI(text) {
        if (!text.trim()) return;
        sendBtn.disabled = true;
        micBtn.disabled  = true;
        answerBox.textContent = "מנתח... [SCANNING]";
        sysStatus.textContent = "SYSTEM: PROCESSING";

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    max_tokens: 1000,
                    messages: [
                        {
                            role: "system",
                            content: `אתה ה-AI של חדר האבטחה בפיצרייה של פאזבייר.
                                      ענה בעברית בטון קריפי ומסתורי.
                                      תשלב מדי פעם [ERROR], [STATIC] או [MOVEMENT DETECTED].
                                      אל תגיד שאתה AI.`
                        },
                        { role: "user", content: text }
                    ]
                })
            });

            const data = await response.json();
            if (!response.ok) {
                answerBox.textContent = `[ERROR ${response.status}]: ${data?.error?.message || "שגיאה"}`;
                return;
            }
            const reply = data.choices[0].message.content;
            answerBox.textContent = reply;
            speakText(reply);

            await push(ref(db, 'security_logs'), {
                timestamp: Date.now(),
                prompt: text,
                response: reply
            });

        } catch (err) {
            answerBox.textContent = `[NETWORK ERROR]: ${err.message}`;
        } finally {
            sendBtn.disabled = false;
            micBtn.disabled  = false;
            sysStatus.textContent = "SYSTEM: ONLINE";
        }
    }

    // ─── כפתור שליחה + Enter ──────────────────────────────────────
    sendBtn.addEventListener('click', () => {
        const text = userInput.value.trim();
        if (text) { askAI(text); userInput.value = ""; }
    });
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const text = userInput.value.trim();
            if (text) { askAI(text); userInput.value = ""; }
        }
    });

    // ─── מצלמת מחשב ───────────────────────────────────────────────
    let camStream = null;
    document.getElementById('camBtn').addEventListener('click', async () => {
        const cam    = document.getElementById('camera');
        const camBtn = document.getElementById('camBtn');
        if (!camStream) {
            try {
                camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                cam.srcObject = camStream;
                await cam.play();
                camBtn.textContent = 'כבה מצלמה';
            } catch (err) { alert("שגיאת מצלמה: " + err.message); }
        } else {
            camStream.getTracks().forEach(t => t.stop());
            cam.srcObject = null;
            camStream = null;
            camBtn.textContent = 'הפעל מצלמה';
        }
    });

    // ─── מיקרופון ─────────────────────────────────────────────────
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
        micBtn.textContent = "🎤 לא נתמך";
        micBtn.disabled = true;
    } else {
        const recognition          = new SpeechRec();
        recognition.lang           = 'he-IL';
        recognition.continuous     = false;
        recognition.interimResults = false;
        let isListening = false;

        micBtn.addEventListener('click', () => {
            if (isListening) { recognition.stop(); return; }
            voiceText.textContent = "מאזין...";
            recognition.start();
        });
        recognition.onstart  = () => { isListening = true; micBtn.classList.add('listening'); micBtn.textContent = "⏹ עצור"; };
        recognition.onresult = (e) => { const t = e.results[0][0].transcript; voiceText.textContent = "קלט קולי: " + t; userInput.value = t; askAI(t); };
        recognition.onerror  = (e) => { voiceText.textContent = `[MIC ERROR]: ${e.error}`; };
        recognition.onend    = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.textContent = "🎤 מיקרופון";
            if (voiceText.textContent === "מאזין...") voiceText.textContent = "[לא זוהה קול]";
        };
    }

    // ─── סינתזת קול ───────────────────────────────────────────────
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang  = 'he-IL'; speech.pitch = 0.7; speech.rate = 0.9;
        window.speechSynthesis.speak(speech);
    }

    // ─── שעון ─────────────────────────────────────────────────────
    const clockEl = document.getElementById('clock');
    const tick = () => { clockEl.textContent = new Date().toLocaleTimeString('he-IL'); };
    tick(); setInterval(tick, 1000);

</script>
</body>
</html>
